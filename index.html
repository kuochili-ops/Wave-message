<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>白六沙灘量子訊息 App</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0d0d0d;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        /* 嚴格鎖定 16:9 橫向畫面舞台 */
        .app-container {
            position: relative;
            width: 100vw;
            height: calc(100vw * 9 / 16);
            max-width: 932px;  
            max-height: 524px; 
            aspect-ratio: 16 / 9;
            background: #dfceb6;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border-radius: 12px;
        }

        @media (max-aspect-ratio: 16/9) {
            .app-container {
                width: 100vw;
                height: calc(100vw * 9 / 16);
            }
        }
        @media (min-aspect-ratio: 16/9) {
            .app-container {
                height: 100vh;
                width: calc(100vh * 16 / 9);
            }
        }

        /* 主畫面畫布區 */
        .stage {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #dfceb6;
        }
        #beachCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* 控制面板核心修正：精簡內邊距與佈局 */
        .settings-panel {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%; 
            background: rgba(255, 255, 255, 0.98); 
            z-index: 200; 
            transform: translateY(100%);  
            transition: transform 0.25s cubic-bezier(0.1, 0.76, 0.55, 0.94);
            padding: 12px 16px 16px 16px; /* 縮減邊距，爭取垂直空間 */
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .settings-panel.open {
            transform: translateY(0); 
        }

        /* 上半部元件包裝區：限制最大佔用高度 */
        .panel-header-zone {
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 8px; /* 縮小元件之間的間距 */
            margin-bottom: 8px;
        }
        .panel-title {
            font-size: 15px;
            font-weight: bold;
            color: #222;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .close-panel-btn {
            font-size: 12px;
            color: #ffffff;
            background: #ff3b30;
            padding: 4px 12px;
            border-radius: 20px; 
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 2px 6px rgba(255, 59, 48, 0.3);
        }

        /* 膠囊切換鈕高度優化 */
        .options-group {
            display: flex;
            gap: 8px;
        }
        .option-item {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
            background: #f0f4f8;
            padding: 6px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
            color: #4a5568;
            transition: all 0.2s;
            border: 1px solid #e2e8f0;
        }
        .option-item:has(input:checked) {
            background: #e1effe;
            color: #1a56db;
            border-color: #bfdbfe;
        }
        .option-item input {
            cursor: pointer;
            width: 14px;
            height: 14px;
        }

        /* 輸入框組緊湊化 */
        .input-group {
            display: flex;
            gap: 8px;
        }
        .msg-input {
            flex: 1;
            height: 36px; /* 適度調整為 36px，既好按又省空間 */
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            padding: 0 12px;
            font-size: 13px;
            outline: none;
            color: #000;
            background: #fff;
        }
        .msg-input:focus {
            border-color: #144b73;
        }
        .add-btn {
            height: 36px;
            background: #144b73;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 0 16px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }
        .add-btn.edit-mode {
            background: #ff9500;
        }

        /* 工具按鈕組緊湊化 */
        .tools-group {
            display: flex;
            gap: 8px;
        }
        .tool-btn {
            flex: 1;
            height: 32px;
            border: none;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 4px;
        }
        .btn-url { background: #34c759; }  
        .btn-record { background: #ff9500; } 
        .btn-record.recording { background: #ff3b30; animation: pulse 1.2s infinite; }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        /* 🚀 終極修正：強制定義最大高度並允許內部獨立捲動，絕對不被擠出畫面 */
        .msg-list-container {
            flex: 1; 
            min-height: 80px; /* 保障至少能露出一行半的高度的安全底線 */
            overflow-y: auto; 
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            background: #f8fafc;
            padding: 4px;
            -webkit-overflow-scrolling: touch; 
        }
        .msg-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px; 
            font-size: 12px;
            color: #334155;
            border-bottom: 1px solid #edf2f7;
            background: #ffffff;
            margin-bottom: 4px;
            border-radius: 4px;
        }
        .msg-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }
        .item-text {
            text-overflow: ellipsis;
            overflow: hidden;
            white-space: nowrap;
            max-width: 65%;
            font-weight: 500;
        }
        .item-actions {
            display: flex;
            gap: 14px; 
            flex-shrink: 0;
        }
        .edit-item-btn {
            color: #3b82f6;
            cursor: pointer;
            font-weight: bold;
        }
        .delete-item-btn {
            color: #ef4444;
            cursor: pointer;
            font-weight: bold;
        }
        
        .floating-menu-btn {
            position: absolute;
            bottom: 16px;
            right: 16px;
            width: 46px;
            height: 46px;
            background: rgba(20, 75, 115, 0.9);
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            cursor: pointer;
            z-index: 150; 
            box-shadow: 0 4px 14px rgba(0,0,0,0.4);
            border: 2px solid #ffffff;
            transition: transform 0.1s;
        }
        .floating-menu-btn:active {
            transform: scale(0.9);
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="stage" id="stage">
        <canvas id="beachCanvas"></canvas>
        <div class="floating-menu-btn" id="floatBtn">⚙️</div>
    </div>

    <div class="settings-panel" id="settingsPanel">
        <div class="panel-header-zone">
            <div class="panel-title">
                <span>沙灘量子訊息控制中心 🐾</span>
                <span class="close-panel-btn" id="closePanelBtn">✕ 收回</span>
            </div>

            <div class="options-group">
                <label class="option-item">
                    <input type="checkbox" id="showDateCheck" checked> 顯示日期與星期浪
                </label>
                <label class="option-item">
                    <input type="checkbox" id="showTimeCheck" checked> 顯示當前時間浪
                </label>
            </div>
            
            <div class="input-group">
                <input type="text" id="newMsgInput" class="msg-input" placeholder="輸入刻在沙灘上的文字..." autocomplete="off">
                <button id="addMsgBtn" class="add-btn">加入</button>
            </div>

            <div class="tools-group">
                <button id="genUrlBtn" class="tool-btn btn-url">🔗 生成分享網址並複製</button>
                <button id="recordBtn" class="tool-btn btn-record">📹 錄製完整循環影片</button>
            </div>
        </div>

        <div class="msg-list-container" id="msgListContainer"></div>
    </div>
</div>

<script>
    const canvas = document.getElementById('beachCanvas');
    const ctx = canvas.getContext('2d');
    const stage = document.getElementById('stage');
    
    const floatBtn = document.getElementById('floatBtn');
    const closePanelBtn = document.getElementById('closePanelBtn');
    const settingsPanel = document.getElementById('settingsPanel');
    const newMsgInput = document.getElementById('newMsgInput');
    const addMsgBtn = document.getElementById('addMsgBtn');
    const msgListContainer = document.getElementById('msgListContainer');
    const genUrlBtn = document.getElementById('genUrlBtn');
    const recordBtn = document.getElementById('recordBtn');

    const showDateCheck = document.getElementById('showDateCheck');
    const showTimeCheck = document.getElementById('showTimeCheck');

    function getInitialConfig() {
        let config = {
            showDate: true,
            showTime: true,
            messages: ["大家好", "午安", "歡迎來到白六沙灘 🌊"]
        };
        try {
            const urlParams = new URLSearchParams(window.location.search);
            const msgParam = urlParams.get('msg');
            const dParam = urlParams.get('d');
            const tParam = urlParams.get('t');
            
            if (msgParam) {
                const decodedData = decodeURIComponent(atob(msgParam));
                const parsed = JSON.parse(decodedData);
                if (Array.isArray(parsed) && parsed.length > 0) config.messages = parsed;
            }
            if (dParam === '0') config.showDate = false;
            if (tParam === '0') config.showTime = false;
        } catch (e) {
            console.error(e);
        }
        return config;
    }

    const appConfig = getInitialConfig();
    let quantumMessages = appConfig.messages;
    showDateCheck.checked = appConfig.showDate;
    showTimeCheck.checked = appConfig.showTime;

    let currentMsgIndex = 0; 
    let editingIndex = -1; 
    let currentWaveState = 'msg'; 

    function openPanel() {
        settingsPanel.classList.add('open');
        floatBtn.style.visibility = 'hidden';
        renderMsgList();
    }
    function closePanel() {
        settingsPanel.classList.remove('open');
        floatBtn.style.visibility = 'visible';
        resetInputState();
    }
    floatBtn.addEventListener('click', openPanel);
    closePanelBtn.addEventListener('click', closePanel);

    function resetInputState() {
        editingIndex = -1;
        newMsgInput.value = "";
        addMsgBtn.textContent = "加入";
        addMsgBtn.classList.remove('edit-mode');
    }

    function renderMsgList() {
        msgListContainer.innerHTML = "";
        quantumMessages.forEach((msg, index) => {
            const item = document.createElement('div');
            item.className = 'msg-item';
            
            const textSpan = document.createElement('span');
            textSpan.className = 'item-text';
            textSpan.textContent = `${index + 1}. ${msg}`;
            
            const actionsDiv = document.createElement('div');
            actionsDiv.className = 'item-actions';

            const editBtn = document.createElement('span');
            editBtn.className = 'edit-item-btn';
            editBtn.textContent = '編輯';
            editBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                editingIndex = index;
                newMsgInput.value = msg;
                addMsgBtn.textContent = "儲存修改";
                addMsgBtn.classList.add('edit-mode');
                newMsgInput.focus();
            });
            
            const delBtn = document.createElement('span');
            delBtn.className = 'delete-item-btn';
            delBtn.textContent = '刪除';
            delBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                if(quantumMessages.length <= 1) {
                    alert("請至少保留一條訊息！");
                    return;
                }
                quantumMessages.splice(index, 1);
                if(currentMsgIndex >= quantumMessages.length) currentMsgIndex = 0;
                if(editingIndex === index) resetInputState();
                renderMsgList();
            });

            actionsDiv.appendChild(editBtn);
            actionsDiv.appendChild(delBtn);
            item.appendChild(textSpan);
            item.appendChild(actionsDiv);
            msgListContainer.appendChild(item);
        });
    }

    function handleAddOrEdit() {
        const text = newMsgInput.value.trim();
        if(!text) return;

        if (editingIndex > -1) {
            quantumMessages[editingIndex] = text;
            resetInputState();
        } else {
            quantumMessages.push(text);
            newMsgInput.value = "";
        }
        renderMsgList();
    }
    addMsgBtn.addEventListener('click', handleAddOrEdit);
    newMsgInput.addEventListener('keypress', (e) => {
        if(e.key === 'Enter') handleAddOrEdit();
    });

    genUrlBtn.addEventListener('click', () => {
        try {
            const jsonStr = JSON.stringify(quantumMessages);
            const base64Data = btoa(encodeURIComponent(jsonStr));
            const dVal = showDateCheck.checked ? '1' : '0';
            const tVal = showTimeCheck.checked ? '1' : '0';
            const shareUrl = `${window.location.origin}${window.location.pathname}?msg=${base64Data}&d=${dVal}&t=${tVal}`;
            navigator.clipboard.writeText(shareUrl).then(() => {
                alert("分享網址已複製！已儲存您的時間顯示偏好。");
            }).catch(() => {
                prompt("請手動複製網址：", shareUrl);
            });
        } catch(err) { alert(err); }
    });

    // === 自動錄影控制 ===
    let mediaRecorder = null, recordedChunks = [], isRecording = false;
    let hasCompletedFullLoop = false;

    function startAutoRecording() {
        recordedChunks = [];
        hasCompletedFullLoop = false;
        
        currentMsgIndex = 0;
        currentWaveState = 'msg';
        time = Math.PI * 1.5; 

        const stream = canvas.captureStream(30);
        let options = { mimeType: 'video/webm;codecs=vp9' };
        if (!MediaRecorder.isTypeSupported(options.mimeType)) options = { mimeType: 'video/webm' };

        try { 
            mediaRecorder = new MediaRecorder(stream, options); 
        } catch(e) { 
            alert("瀏覽器不支援錄影"); 
            return; 
        }

        mediaRecorder.ondataavailable = (e) => { if (e.data && e.data.size > 0) recordedChunks.push(e.data); };
        mediaRecorder.onstop = () => {
            const blob = new Blob(recordedChunks, { type: 'video/webm' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `beach_quantum_loop_${Date.now()}.webm`;
            document.body.appendChild(a);
            a.click();
            setTimeout(() => { document.body.removeChild(a); }, 100);
            
            isRecording = false;
            recordBtn.textContent = "📹 錄製完整循環影片";
            recordBtn.classList.remove('recording');
        };

        mediaRecorder.start();
        isRecording = true;
        recordBtn.textContent = "🛑 錄製中...完整循環後自動停止";
        recordBtn.classList.add('recording');
        closePanel(); 
    }

    function stopAutoRecording() {
        if(mediaRecorder && mediaRecorder.state !== 'inactive') {
            mediaRecorder.stop();
        }
    }

    recordBtn.addEventListener('click', () => {
        if (!isRecording) startAutoRecording();
        else stopAutoRecording();
    });

    function initCanvas() {
        canvas.width = stage.clientWidth;
        canvas.height = stage.clientHeight;
    }
    window.addEventListener('resize', initCanvas);
    initCanvas();

    // === 物理波浪參數 ===
    let time = Math.PI * 1.5; 
    const waveSpeed = 0.015;   
    const waveBaseY = -80;     
    const waveAmplitude = 380; 

    let hasSwitchedThisCycle = false; 

    function getFormattedDateTime() {
        const now = new Date();
        const month = now.getMonth() + 1;
        const date = now.getDate();
        const weekDays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
        const dayName = weekDays[now.getDay()];
        
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');

        return {
            dateStr: `${month}/${date} ${dayName}`,
            timeStr: `${hours}:${minutes}`
        };
    }

    function animate() {
        time += waveSpeed;

        let sandGrd = ctx.createLinearGradient(0, 0, 0, canvas.height);
        sandGrd.addColorStop(0, '#917c65');   
        sandGrd.addColorStop(0.4, '#bcaaa0');
        sandGrd.addColorStop(0.85, '#dfceb6'); 
        ctx.fillStyle = sandGrd;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        let waveCycle = Math.sin(time); 
        let currentWaveLine = waveBaseY + (waveCycle + 1) * 0.5 * waveAmplitude;

        let isReceding = Math.cos(time) < 0; 
        const textY = canvas.height * 0.62; 

        if (!isReceding) {
            if (currentWaveLine > textY + 60) {
                if (!hasSwitchedThisCycle) {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    
                    if (currentWaveState === 'msg') {
                        if (currentMsgIndex < quantumMessages.length - 1) {
                            currentMsgIndex++;
                        } else {
                            if (showDateCheck.checked) {
                                currentWaveState = 'date';
                            } else if (showTimeCheck.checked) {
                                currentWaveState = 'time';
                            } else {
                                currentMsgIndex = 0;
                                if (isRecording) hasCompletedFullLoop = true;
                            }
                        }
                    } 
                    else if (currentWaveState === 'date') {
                        if (showTimeCheck.checked) {
                            currentWaveState = 'time';
                        } else {
                            currentWaveState = 'msg';
                            currentMsgIndex = 0;
                            if (isRecording) hasCompletedFullLoop = true;
                        }
                    } 
                    else if (currentWaveState === 'time') {
                        currentWaveState = 'msg';
                        currentMsgIndex = 0;
                        if (isRecording) hasCompletedFullLoop = true;
                    }

                    hasSwitchedThisCycle = true; 
                }
            }
        } else {
            if (currentWaveLine < textY - 40) {
                hasSwitchedThisCycle = false; 
                
                if (isRecording && hasCompletedFullLoop && currentWaveState === 'msg' && currentMsgIndex === 0) {
                    isRecording = false; 
                    setTimeout(stopAutoRecording, 1000);
                }
            }
        }

        ctx.save();
        ctx.beginPath();
        ctx.moveTo(0, currentWaveLine); 
        ctx.lineTo(canvas.width, currentWaveLine);
        ctx.lineTo(canvas.width, canvas.height);
        ctx.lineTo(0, canvas.height);
        ctx.closePath();
        ctx.clip(); 

        const dt = getFormattedDateTime();
        
        if (currentWaveState === 'msg' && quantumMessages[currentMsgIndex]) {
            drawSandText(quantumMessages[currentMsgIndex], textY, currentWaveLine, 'msg');
        } else if (currentWaveState === 'date') {
            drawSandText(dt.dateStr, textY, currentWaveLine, 'date');
        } else if (currentWaveState === 'time') {
            drawSandText(dt.timeStr, textY, currentWaveLine, 'time');
        }

        ctx.restore();

        ctx.save();
        ctx.beginPath();
        ctx.moveTo(0, 0);
        for (let x = 0; x <= canvas.width; x += 8) {
            let whiteNoise = Math.sin(x * 0.012 + time * 3.2) * 16
                           + Math.cos(x * 0.025 - time * 1.8) * 10
                           + Math.sin(x * 0.06 + time * 4.5) * 4;
            let y = currentWaveLine + whiteNoise;
            ctx.lineTo(x, y);
        }
        ctx.lineTo(canvas.width, 0);
        ctx.closePath();

        let seaGrd = ctx.createLinearGradient(0, 0, 0, currentWaveLine);
        seaGrd.addColorStop(0, '#005f73');   
        seaGrd.addColorStop(0.4, '#0a9396');  
        seaGrd.addColorStop(0.85, '#94d2bd'); 
        seaGrd.addColorStop(1, '#e9d8a6');    
        ctx.fillStyle = seaGrd;
        ctx.fill();
        ctx.restore();

        drawWhiteFoamOnFront(currentWaveLine);

        requestAnimationFrame(animate);
    }

    function drawSandText(text, y, currentWaveLine, type) {
        let distance = Math.max(0, y - currentWaveLine);
        let textAlpha = Math.min(1, distance / 35); 

        ctx.save();
        ctx.globalAlpha = textAlpha;
        
        const availableWidth = canvas.width - 80;
        
        let fontSize = 36;
        if (type === 'date') {
            fontSize = 42; 
        } else if (type === 'time') {
            fontSize = 50; 
        } else {
            if (text.length <= 3) fontSize = 56;  
            else if (text.length <= 6) fontSize = 42;
        }

        ctx.font = `bold ${fontSize}px 'PingFang TC', 'Microsoft JhengHei', sans-serif`;
        
        let textMetrics = ctx.measureText(text).width;
        if (textMetrics > availableWidth) {
            fontSize = Math.floor((availableWidth / textMetrics) * fontSize);
            if (fontSize < 16) fontSize = 16;
            ctx.font = `bold ${fontSize}px 'PingFang TC', 'Microsoft JhengHei', sans-serif`;
        }
        
        ctx.textAlign = "center"; 
        ctx.textBaseline = "middle";
        const x = canvas.width / 2;

        ctx.fillStyle = "rgba(56, 42, 27, 0.85)";
        ctx.shadowColor = "rgba(0, 0, 0, 0.65)";
        ctx.shadowBlur = 4;
        ctx.shadowOffsetX = 2;
        ctx.shadowOffsetY = 2;
        ctx.fillText(text, x, y);

        ctx.shadowColor = "rgba(255, 255, 255, 0.45)";
        ctx.shadowOffsetX = -1.5;
        ctx.shadowOffsetY = -1.5;
        ctx.shadowBlur = 0.5;
        ctx.fillStyle = "rgba(75, 60, 40, 0.15)";
        ctx.fillText(text, x, y);

        ctx.restore();
    }

    function drawWhiteFoamOnFront(waveLine) {
        ctx.save();
        for (let layer = 3; layer >= 1; layer--) {
            ctx.beginPath();
            for (let x = 0; x <= canvas.width; x += 10) {
                let frontNoise = Math.sin(x * 0.022 + time * 3.5 + layer) * 15 
                               + Math.cos(x * 0.05 - time * 2.1 + layer) * 8
                               + Math.sin(x * 0.09 + time * 5.0) * 3;
                
                let y = waveLine + (layer * 3.5) + frontNoise;
                if (x === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }

            if (layer === 3) {
                ctx.lineWidth = 14;
                ctx.strokeStyle = "rgba(255, 255, 255, 0.4)"; 
                ctx.stroke();
            } else if (layer === 2) {
                ctx.lineWidth = 8;
                ctx.strokeStyle = "rgba(255, 255, 255, 0.75)"; 
                ctx.stroke();
            } else if (layer === 1) {
                ctx.lineWidth = 4;
                ctx.strokeStyle = "rgba(255, 255, 255, 0.98)";  
                ctx.shadowColor = "rgba(255, 255, 255, 0.8)";
                ctx.shadowBlur = 8;
                ctx.stroke();
            }
        }
        ctx.restore();
    }

    animate();
</script>

</body>
</html>
