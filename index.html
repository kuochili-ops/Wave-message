<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>白六沙灘量子訊息 App</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0d0d0d;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        /* 嚴格鎖定 16:9 橫向畫面舞台 */
        .app-container {
            position: relative;
            width: 100vw;
            height: calc(100vw * 9 / 16);
            max-width: 932px;  
            max-height: 524px; 
            aspect-ratio: 16 / 9;
            background: #dfceb6;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border-radius: 12px;
        }

        @media (max-aspect-ratio: 16/9) {
            .app-container {
                width: 100vw;
                height: calc(100vw * 9 / 16);
            }
        }
        @media (min-aspect-ratio: 16/9) {
            .app-container {
                height: 100vh;
                width: calc(100vh * 16 / 9);
            }
        }

        /* 主畫面畫布區 */
        .stage {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #dfceb6;
        }
        #beachCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* 今天時間標籤 */
        .date-tag {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.7);
            padding: 4px 18px;
            border-radius: 12px;
            font-size: 11px;
            color: #222;
            z-index: 50;
            pointer-events: none;
            font-weight: bold;
            letter-spacing: 1px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        /* 🛠️ 【全新空間重構】滿版高操作性控制面板 */
        .settings-panel {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%; /* 直接撐滿整個16:9畫面，給予手機點擊最大的操作空間 */
            background: rgba(255, 255, 255, 0.98); /* 帶有極輕微透感的優雅純白 */
            z-index: 200; 
            transform: translateY(100%);  /* 從下方滑出 */
            transition: transform 0.28s cubic-bezier(0.1, 0.76, 0.55, 0.94);
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
        }
        .settings-panel.open {
            transform: translateY(0); 
        }

        /* 面板頭部：標題與右上角固定的收合鈕 */
        .panel-header-zone {
            flex-shrink: 0;
            margin-bottom: 10px;
        }
        .panel-title {
            font-size: 15px;
            font-weight: bold;
            color: #222;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .close-panel-btn {
            font-size: 12px;
            color: #ffffff;
            background: #ff3b30;
            padding: 5px 14px;
            border-radius: 20px; /* 圓角化，看起來更像原生 App 元件 */
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 2px 6px rgba(255, 59, 48, 0.3);
        }

        /* 輸入群組 */
        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }
        .msg-input {
            flex: 1;
            height: 38px;
            border: 1px solid #bbb;
            border-radius: 8px;
            padding: 0 12px;
            font-size: 13px;
            outline: none;
            color: #000;
            background: #fff;
        }
        .msg-input:focus {
            border-color: #144b73;
        }
        .add-btn {
            height: 38px;
            background: #144b73;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0 18px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }
        .add-btn.edit-mode {
            background: #ff9500;
        }

        /* 功能按鈕區 */
        .tools-group {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }
        .tool-btn {
            flex: 1;
            height: 36px;
            border: none;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 4px;
        }
        .btn-url { background: #34c759; }  
        .btn-record { background: #ff9500; } 
        .btn-record.recording { background: #ff3b30; animation: pulse 1.2s infinite; }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        /* 🚀 【空間優化核心】徹底釋放空間的訊息清單 */
        .msg-list-container {
            flex: 1; /* 佔滿剩餘的所有垂直空間 */
            overflow-y: auto; /* 啟用完美滾動 */
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            background: #fafafa;
            padding: 4px;
            -webkit-overflow-scrolling: touch; /* 優化 iOS 滾動絲滑度 */
        }
        .msg-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px; /* 加大點擊間距 */
            font-size: 13px;
            color: #333;
            border-bottom: 1px solid #eee;
            background: #ffffff;
            margin-bottom: 4px;
            border-radius: 6px;
        }
        .msg-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }
        .item-text {
            text-overflow: ellipsis;
            overflow: hidden;
            white-space: nowrap;
            max-width: 70%;
        }
        .item-actions {
            display: flex;
            gap: 16px; /* 加寬按鈕防呆間距 */
            flex-shrink: 0;
        }
        .edit-item-btn {
            color: #007aff;
            cursor: pointer;
            font-weight: bold;
        }
        .delete-item-btn {
            color: #ff3b30;
            cursor: pointer;
            font-weight: bold;
        }
        
        /* 右下角圓形齒輪設定按鈕 */
        .floating-menu-btn {
            position: absolute;
            bottom: 16px;
            right: 16px;
            width: 46px;
            height: 46px;
            background: rgba(20, 75, 115, 0.9);
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            cursor: pointer;
            z-index: 150; 
            box-shadow: 0 4px 14px rgba(0,0,0,0.4);
            border: 2px solid #ffffff;
            transition: transform 0.1s;
        }
        .floating-menu-btn:active {
            transform: scale(0.9);
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="stage" id="stage">
        <div class="date-tag">今天</div>
        <canvas id="beachCanvas"></canvas>
        
        <div class="floating-menu-btn" id="floatBtn">⚙️</div>
    </div>

    <div class="settings-panel" id="settingsPanel">
        <div class="panel-header-zone">
            <div class="panel-title">
                <span>沙灘量子訊息控制中心 🐾</span>
                <span class="close-panel-btn" id="closePanelBtn">✕ 收回</span>
            </div>
            
            <div class="input-group">
                <input type="text" id="newMsgInput" class="msg-input" placeholder="輸入刻在沙灘上的文字..." autocomplete="off">
                <button id="addMsgBtn" class="add-btn">加入</button>
            </div>

            <div class="tools-group">
                <button id="genUrlBtn" class="tool-btn btn-url">🔗 生成分享網址並複製</button>
                <button id="recordBtn" class="tool-btn btn-record">📹 錄製完整循環影片</button>
            </div>
        </div>

        <div class="msg-list-container" id="msgListContainer"></div>
    </div>
</div>

<script>
    const canvas = document.getElementById('beachCanvas');
    const ctx = canvas.getContext('2d');
    const stage = document.getElementById('stage');
    
    const floatBtn = document.getElementById('floatBtn');
    const closePanelBtn = document.getElementById('closePanelBtn');
    const settingsPanel = document.getElementById('settingsPanel');
    const newMsgInput = document.getElementById('newMsgInput');
    const addMsgBtn = document.getElementById('addMsgBtn');
    const msgListContainer = document.getElementById('msgListContainer');
    const genUrlBtn = document.getElementById('genUrlBtn');
    const recordBtn = document.getElementById('recordBtn');

    // 解析 URL 參數
    function getInitialMessages() {
        try {
            const urlParams = new URLSearchParams(window.location.search);
            const msgParam = urlParams.get('msg');
            if (msgParam) {
                const decodedData = decodeURIComponent(atob(msgParam));
                const parsed = JSON.parse(decodedData);
                if (Array.isArray(parsed) && parsed.length > 0) return parsed;
            }
        } catch (e) {
            console.error(e);
        }
        return ["大家好", "午安", "歡迎來到白六沙灘 🌊"];
    }

    let quantumMessages = getInitialMessages();
    let currentMsgIndex = 0; 
    let editingIndex = -1; 

    function openPanel() {
        settingsPanel.classList.add('open');
        floatBtn.style.visibility = 'hidden';
        renderMsgList();
    }
    function closePanel() {
        settingsPanel.classList.remove('open');
        floatBtn.style.visibility = 'visible';
        resetInputState();
    }
    floatBtn.addEventListener('click', openPanel);
    closePanelBtn.addEventListener('click', closePanel);

    function resetInputState() {
        editingIndex = -1;
        newMsgInput.value = "";
        addMsgBtn.textContent = "加入";
        addMsgBtn.classList.remove('edit-mode');
    }

    function renderMsgList() {
        msgListContainer.innerHTML = "";
        quantumMessages.forEach((msg, index) => {
            const item = document.createElement('div');
            item.className = 'msg-item';
            
            const textSpan = document.createElement('span');
            textSpan.className = 'item-text';
            textSpan.textContent = `${index + 1}. ${msg}`;
            
            const actionsDiv = document.createElement('div');
            actionsDiv.className = 'item-actions';

            const editBtn = document.createElement('span');
            editBtn.className = 'edit-item-btn';
            editBtn.textContent = '編輯';
            editBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                editingIndex = index;
                newMsgInput.value = msg;
                addMsgBtn.textContent = "儲存修改";
                addMsgBtn.classList.add('edit-mode');
                newMsgInput.focus();
            });
            
            const delBtn = document.createElement('span');
            delBtn.className = 'delete-item-btn';
            delBtn.textContent = '刪除';
            delBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                if(quantumMessages.length <= 1) {
                    alert("請至少保留一條訊息！");
                    return;
                }
                quantumMessages.splice(index, 1);
                if(currentMsgIndex >= quantumMessages.length) currentMsgIndex = 0;
                if(editingIndex === index) resetInputState();
                renderMsgList();
            });

            actionsDiv.appendChild(editBtn);
            actionsDiv.appendChild(delBtn);
            item.appendChild(textSpan);
            item.appendChild(actionsDiv);
            msgListContainer.appendChild(item);
        });
    }

    function handleAddOrEdit() {
        const text = newMsgInput.value.trim();
        if(!text) return;

        if (editingIndex > -1) {
            quantumMessages[editingIndex] = text;
            resetInputState();
        } else {
            quantumMessages.push(text);
            newMsgInput.value = "";
        }
        renderMsgList();
    }
    addMsgBtn.addEventListener('click', handleAddOrEdit);
    newMsgInput.addEventListener('keypress', (e) => {
        if(e.key === 'Enter') handleAddOrEdit();
    });

    genUrlBtn.addEventListener('click', () => {
        try {
            const jsonStr = JSON.stringify(quantumMessages);
            const base64Data = btoa(encodeURIComponent(jsonStr));
            const shareUrl = `${window.location.origin}${window.location.pathname}?msg=${base64Data}`;
            navigator.clipboard.writeText(shareUrl).then(() => {
                alert("分享網址已複製！");
            }).catch(() => {
                prompt("請手動複製網址：", shareUrl);
            });
        } catch(err) { alert(err); }
    });

    // === 自動錄影控制 ===
    let mediaRecorder = null, recordedChunks = [], isRecording = false;
    let recordedIndices = new Set(); 

    function startAutoRecording() {
        recordedChunks = [];
        recordedIndices.clear();
        recordedIndices.add(currentMsgIndex);

        const stream = canvas.captureStream(30);
        let options = { mimeType: 'video/webm;codecs=vp9' };
        if (!MediaRecorder.isTypeSupported(options.mimeType)) options = { mimeType: 'video/webm' };

        try { 
            mediaRecorder = new MediaRecorder(stream, options); 
        } catch(e) { 
            alert("瀏覽器不支援錄影"); 
            return; 
        }

        mediaRecorder.ondataavailable = (e) => { if (e.data && e.data.size > 0) recordedChunks.push(e.data); };
        mediaRecorder.onstop = () => {
            const blob = new Blob(recordedChunks, { type: 'video/webm' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `beach_loop_wave_${Date.now()}.webm`;
            document.body.appendChild(a);
            a.click();
            setTimeout(() => { document.body.removeChild(a); }, 100);
            
            isRecording = false;
            recordBtn.textContent = "📹 錄製完整循環影片";
            recordBtn.classList.remove('recording');
        };

        mediaRecorder.start();
        isRecording = true;
        recordBtn.textContent = "🛑 錄製中...播完所有字即自動停止";
        recordBtn.classList.add('recording');
        closePanel(); 
    }

    function stopAutoRecording() {
        if(mediaRecorder && mediaRecorder.state !== 'inactive') {
            mediaRecorder.stop();
        }
    }

    recordBtn.addEventListener('click', () => {
        if (!isRecording) startAutoRecording();
        else stopAutoRecording();
    });

    function initCanvas() {
        canvas.width = stage.clientWidth;
        canvas.height = stage.clientHeight;
    }
    window.addEventListener('resize', initCanvas);
    initCanvas();

    // === 物理波浪參數 ===
    let time = 0;
    const waveSpeed = 0.015;   
    const waveBaseY = -80;     
    const waveAmplitude = 380; 

    let hasSwitchedThisCycle = false; 

    function animate() {
        time += waveSpeed;

        // 1. 繪製細緻沙灘底色
        let sandGrd = ctx.createLinearGradient(0, 0, 0, canvas.height);
        sandGrd.addColorStop(0, '#917c65');   
        sandGrd.addColorStop(0.4, '#bcaaa0');
        sandGrd.addColorStop(0.85, '#dfceb6'); 
        ctx.fillStyle = sandGrd;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 2. 計算波浪動態線
        let waveCycle = Math.sin(time); 
        let currentWaveLine = waveBaseY + (waveCycle + 1) * 0.5 * waveAmplitude;

        let isReceding = Math.cos(time) < 0; 
        const textY = canvas.height * 0.65; 

        // 漲潮深處換字邏輯
        if (!isReceding) {
            if (currentWaveLine > textY + 60) {
                if (!hasSwitchedThisCycle) {
                    // ✨ 殘影優化：換字瞬間強制清理畫布快取，確保舊字陰影不外漏
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    
                    currentMsgIndex = (currentMsgIndex + 1) % quantumMessages.length;
                    hasSwitchedThisCycle = true; 

                    if (isRecording) {
                        recordedIndices.add(currentMsgIndex);
                        if (recordedIndices.size >= quantumMessages.length) {
                            setTimeout(stopAutoRecording, 1200);
                        }
                    }
                }
            }
        } else {
            if (currentWaveLine < textY - 40) {
                hasSwitchedThisCycle = false; 
            }
        }

        // 3. 【動態裁剪遮罩 - 文字從浪退後的底部浮現】
        if(quantumMessages[currentMsgIndex]) {
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(0, currentWaveLine); 
            ctx.lineTo(canvas.width, currentWaveLine);
            ctx.lineTo(canvas.width, canvas.height);
            ctx.lineTo(0, canvas.height);
            ctx.closePath();
            ctx.clip(); 

            drawSandText(quantumMessages[currentMsgIndex], textY, currentWaveLine);
            ctx.restore();
        }

        // 4. 【海水主體】
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(0, 0);
        for (let x = 0; x <= canvas.width; x += 8) {
            let whiteNoise = Math.sin(x * 0.012 + time * 3.2) * 16
                           + Math.cos(x * 0.025 - time * 1.8) * 10
                           + Math.sin(x * 0.06 + time * 4.5) * 4;
            let y = currentWaveLine + whiteNoise;
            ctx.lineTo(x, y);
        }
        ctx.lineTo(canvas.width, 0);
        ctx.closePath();

        let seaGrd = ctx.createLinearGradient(0, 0, 0, currentWaveLine);
        seaGrd.addColorStop(0, '#005f73');   
        seaGrd.addColorStop(0.4, '#0a9396');  
        seaGrd.addColorStop(0.85, '#94d2bd'); 
        seaGrd.addColorStop(1, '#e9d8a6');    
        ctx.fillStyle = seaGrd;
        ctx.fill();
        ctx.restore();

        // 5. 【純白浪花泡沫】
        drawWhiteFoamOnFront(currentWaveLine);

        requestAnimationFrame(animate);
    }

    // 模擬沙灘刻字
    function drawSandText(text, y, currentWaveLine) {
        let distance = Math.max(0, y - currentWaveLine);
        let textAlpha = Math.min(1, distance / 35); 

        ctx.save();
        ctx.globalAlpha = textAlpha;
        
        const availableWidth = canvas.width - 80;
        
        let fontSize = 36;
        if (text.length <= 3) {
            fontSize = 62;  
        } else if (text.length <= 6) {
            fontSize = 46;
        }

        ctx.font = `bold ${fontSize}px 'PingFang TC', 'Microsoft JhengHei', sans-serif`;
        
        let textMetrics = ctx.measureText(text).width;
        if (textMetrics > availableWidth) {
            fontSize = Math.floor((availableWidth / textMetrics) * fontSize);
            if (fontSize < 16) fontSize = 16;
            ctx.font = `bold ${fontSize}px 'PingFang TC', 'Microsoft JhengHei', sans-serif`;
        }
        
        ctx.textAlign = "center"; 
        ctx.textBaseline = "middle";
        const x = canvas.width / 2;

        // 刻紋內陰影
        ctx.fillStyle = "rgba(56, 42, 27, 0.85)";
        ctx.shadowColor = "rgba(0, 0, 0, 0.65)";
        ctx.shadowBlur = 4;
        ctx.shadowOffsetX = 2;
        ctx.shadowOffsetY = 2;
        ctx.fillText(text, x, y);

        // 邊緣受光反光
        ctx.shadowColor = "rgba(255, 255, 255, 0.45)";
        ctx.shadowOffsetX = -1.5;
        ctx.shadowOffsetY = -1.5;
        ctx.shadowBlur = 0.5;
        ctx.fillStyle = "rgba(75, 60, 40, 0.15)";
        ctx.fillText(text, x, y);

        ctx.restore();
    }

    // 浪花前緣泡沫
    function drawWhiteFoamOnFront(waveLine) {
        ctx.save();
        for (let layer = 3; layer >= 1; layer--) {
            ctx.beginPath();
            for (let x = 0; x <= canvas.width; x += 10) {
                let frontNoise = Math.sin(x * 0.022 + time * 3.5 + layer) * 15 
                               + Math.cos(x * 0.05 - time * 2.1 + layer) * 8
                               + Math.sin(x * 0.09 + time * 5.0) * 3;
                
                let y = waveLine + (layer * 3.5) + frontNoise;
                if (x === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }

            if (layer === 3) {
                ctx.lineWidth = 14;
                ctx.strokeStyle = "rgba(255, 255, 255, 0.4)"; 
                ctx.stroke();
            } else if (layer === 2) {
                ctx.lineWidth = 8;
                ctx.strokeStyle = "rgba(255, 255, 255, 0.75)"; 
                ctx.stroke();
            } else if (layer === 1) {
                ctx.lineWidth = 4;
                ctx.strokeStyle = "rgba(255, 255, 255, 0.98)";  
                ctx.shadowColor = "rgba(255, 255, 255, 0.8)";
                ctx.shadowBlur = 8;
                ctx.stroke();
            }
        }
        ctx.restore();
    }

    animate();
</script>

</body>
</html>
